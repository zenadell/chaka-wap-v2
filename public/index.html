<!DOCTYPE html>
<html>

<head>
    <title>Temple AI v2</title>
    <!-- Fallback Security Permission Slip -->
    <meta http-equiv="Content-Security-Policy"
        content="default-src * data: blob: 'unsafe-inline' 'unsafe-eval'; script-src * data: blob: 'unsafe-inline' 'unsafe-eval'; connect-src * wss: ws:; img-src * data: blob:;">
    <style>
        body {
            background: #000;
            color: #0f0;
            font-family: monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        img {
            border: 5px solid #0f0;
            margin: 20px;
            display: none;
        }

        button {
            padding: 15px 30px;
            font-size: 1.2rem;
            background: #0f0;
            border: none;
            cursor: pointer;
        }

        #logs {
            font-size: 0.8rem;
            color: #666;
            margin-top: 20px;
            margin-top: 20px;
            text-align: left;
            white-space: pre-wrap;
            width: 80%;
            height: 300px;
            overflow-y: scroll;
            background: #111;
            padding: 10px;
            border: 1px solid #0f0;
            display: none;
            /* Hidden until sync starts */
        }
    </style>
</head>

<body>
    <h1>TEMPLE AI: BAILEYS PROTOCOL</h1>
    <div id="status">Status: Idle</div>
    <img id="qr" src="" width="300" height="300">
    <button onclick="start()" id="btn">GENERATE QR CODE</button>

    <!-- SYNC BUTTON -->
    <button id="btn-crawl" style="display:none; background: #ffaa00; margin-top: 20px;" onclick="startCrawl()">
        SYNC CHAT HISTORY
    </button>

    <div id="logs">Waiting for server logs...</div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io({
            transports: ['websocket', 'polling']
        });
        const status = document.getElementById('status');
        const img = document.getElementById('qr');
        const btn = document.getElementById('btn');
        const logDiv = document.getElementById('logs');

        function start() {
            status.innerText = "Status: Requesting QR...";
            btn.style.display = 'none';
            fetch('/api/start-bot', { method: 'POST' })
                .then(res => res.json())
                .then(data => logDiv.innerText = "Server response: " + JSON.stringify(data))
                .catch(err => logDiv.innerText = "Error requesting bot: " + err);
        }

        socket.on('qr', (url) => {
            status.innerText = "Status: SCAN NOW";
            img.src = url;
            img.style.display = 'block';
            logDiv.innerText = "QR Code Received from Socket!";
        });

        socket.on('ready', (msg) => {
            status.innerText = ">> SUCCESS: " + msg;
            img.style.display = 'none';
            document.getElementById('btn-crawl').style.display = 'block'; // Show Sync Button
        });

        async function startCrawl() {
            document.getElementById('btn-crawl').innerText = "LISTENING FOR HISTORY...";
            document.getElementById('btn-crawl').disabled = true;
            document.getElementById('logs').style.display = 'block';
            await fetch('/api/crawl', { method: 'POST' });
        }

        let syncCount = 0;
        socket.on('sync_log', (data) => {
            syncCount++;
            const logBox = document.getElementById('logs');
            const newLine = document.createElement('div');
            newLine.style.borderBottom = "1px solid #333";
            newLine.style.padding = "5px";
            newLine.innerText = `[${syncCount}] 💾 ${data.sender}: ${data.text}`;
            logBox.prepend(newLine); // Newest on top

            // Update button status
            document.getElementById('btn-crawl').innerText = `SYNCED ${syncCount} MSGS`;
        });

        socket.on('sync_status', (data) => {
            const logBox = document.getElementById('logs');
            const newLine = document.createElement('div');
            newLine.style.borderBottom = "1px solid #333";
            newLine.style.padding = "5px";
            newLine.style.color = "#ffaa00"; // Orange for status updates
            newLine.innerText = `[SYSTEM] ⚙️ ${data.message}`;
            logBox.prepend(newLine);
        });

        socket.on('connect_error', (err) => {
            logDiv.innerText = "Socket Error: " + err.message;
        });
    </script>
</body>

</html>
