<!DOCTYPE html>
<html>

<head>
    <title>Temple AI v2</title>
    <style>
        body {
            background: #000;
            color: #0f0;
            font-family: monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        img {
            border: 5px solid #0f0;
            margin: 20px;
            display: none;
        }

        button {
            padding: 15px 30px;
            font-size: 1.2rem;
            background: #0f0;
            border: none;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <h1>TEMPLE AI: BAILEYS PROTOCOL</h1>
    <div id="status">Status: Idle</div>
    <img id="qr" src="" width="300" height="300">
    <button onclick="start()" id="btn">GENERATE QR CODE</button>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const status = document.getElementById('status');
        const img = document.getElementById('qr');
        const btn = document.getElementById('btn');

        function start() {
            status.innerText = "Status: Requesting QR...";
            btn.style.display = 'none';
            fetch('/api/start-bot', { method: 'POST' });
        }

        socket.on('qr', (url) => {
            status.innerText = "Status: SCAN NOW";
            img.src = url;
            img.style.display = 'block';
        });

        socket.on('ready', (msg) => {
            status.innerText = ">> SUCCESS: " + msg;
            img.style.display = 'none';
        });
    </script>
</body>

</html>
